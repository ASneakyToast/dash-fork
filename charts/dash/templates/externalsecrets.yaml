{{- if .Values.externalSecrets.enabled }}
{{- range $name, $spec := .Values.externalSecrets.items }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels: {{- include "dash.labels" (list $ $name) | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $.Values.externalSecrets.store }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
  {{- if $spec.extract }}
  dataFrom:
    - extract:
        key: {{ $spec.key }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
  {{- else }}
  data:
    {{- $data := $spec.data }}
    {{- if kindIs "slice" $data }}
    {{- $data = dict }}
    {{- range $spec.data }}{{ $_ := set $data . . }}{{ end }}
    {{- end }}
    {{- range $secretKey, $property := $data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $spec.key }}
        property: {{ $property }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
