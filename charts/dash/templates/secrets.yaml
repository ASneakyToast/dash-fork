{{- if .Values.secrets.create }}
{{- $values := deepCopy .Values.secrets.values }}
{{- if .Values.postgres.enabled }}
{{- $_ := set $values .Values.configSecret (merge (dict
  "DASH_DATABASE_URL" "postgresql://dash:dash@dash-postgres:5432/dash"
  "NANGO_DATABASE_URL" "postgresql://dash:dash@dash-postgres:5432/nango"
) (get $values .Values.configSecret | default dict)) }}
{{- end }}
{{- range $name, $data := $values }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "dash.labels" (list $ $name) | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- end }}
