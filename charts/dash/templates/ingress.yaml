{{- if .Values.ingress.basicAuth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  labels: {{- include "dash.labels" (list . "dash") | nindent 4 }}
spec:
  basicAuth:
    secret: traefik-basic-auth
    realm: geometry.dev
    removeHeader: true
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dash
  labels: {{- include "dash.labels" (list . "dash") | nindent 4 }}
  {{- if .Values.ingress.basicAuth.enabled }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-basic-auth@kubernetescrd
  {{- end }}
spec:
  rules:
    - host: {{ .Values.hosts.dash }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dash-api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dash-nango
  labels: {{- include "dash.labels" (list . "dash-nango") | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.hosts.nango }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dash-nango
                port:
                  name: api
    - host: {{ .Values.hosts.nangoConnect }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dash-nango
                port:
                  name: connect
