apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dash-redis
  labels: {{- include "dash.labels" (list . "dash-redis") | nindent 4 }}
spec:
  serviceName: dash-redis
  replicas: 1
  selector:
    matchLabels: {{- include "dash.selectorLabels" (list . "dash-redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dash.selectorLabels" (list . "dash-redis") | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: [--appendonly, "yes", --appendfsync, everysec, --dir, /data]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels: {{- toYaml .Values.commonLabels | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClassName }}
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dash-redis
  labels: {{- include "dash.labels" (list . "dash-redis") | nindent 4 }}
spec:
  selector: {{- include "dash.selectorLabels" (list . "dash-redis") | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
