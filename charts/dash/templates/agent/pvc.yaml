apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dash-agent-data
  labels: {{- include "dash.labels" (list . "dash-agent") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.agent.storage }}
