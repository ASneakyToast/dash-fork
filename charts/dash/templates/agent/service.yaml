apiVersion: v1
kind: Service
metadata:
  name: dash-agent
  labels: {{- include "dash.labels" (list . "dash-agent") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "dash.selectorLabels" (list . "dash-agent") | nindent 4 }}
  ports:
    - name: api
      port: 8642
      targetPort: api
    {{- if .Values.agent.dashboard.enabled }}
    - name: dashboard
      port: 9119
      targetPort: dashboard
    {{- end }}
