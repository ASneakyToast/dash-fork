apiVersion: apps/v1
kind: Deployment
metadata:
  name: dash-api
  labels: {{- include "dash.labels" (list . "dash-api") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "dash.selectorLabels" (list . "dash-api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "dash.selectorLabels" (list . "dash-api") | nindent 8 }}
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: migrate
          image: {{ include "dash.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [dash, migrate]
          {{- include "dash.env" . | nindent 10 }}
      containers:
        - name: api
          image: {{ include "dash.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [dash, serve, --host, 0.0.0.0, --port, "8000"]
          ports:
            - name: http
              containerPort: 8000
          {{- include "dash.env" . | nindent 10 }}
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dash-api
  labels: {{- include "dash.labels" (list . "dash-api") | nindent 4 }}
spec:
  selector: {{- include "dash.selectorLabels" (list . "dash-api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
