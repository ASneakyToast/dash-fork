# Build each pull request and publish it to the private package ghcr.io/whatever/dashie-hut-junior.
# Tags only `pr-<number>`. A new push to the PR replaces the tag.
# The job does not push if the package is missing or is not private.
# Create the package as private one time before the first run.
name: Docker dashie-hut-junior

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-dashie-hut-junior-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dashie-hut-junior

jobs:
  publish:
    # Fork PRs get a read-only GITHUB_TOKEN and cannot push.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    steps:
      # This repo is public. A first push from GITHUB_TOKEN can create a public package, and public cannot change back.
      - name: Require a private dashie-hut-junior package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api "/users/${{ github.repository_owner }}/packages/container/dashie-hut-junior" --jq .visibility) || {
            echo "::error::Package dashie-hut-junior does not exist or this repo has no access. Create it as private first."
            exit 1
          }
          if [ "$visibility" != "private" ]; then
            echo "::error::Package dashie-hut-junior is '$visibility', not private. Do not push."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
