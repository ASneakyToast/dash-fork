[project]
name = "dash"
version = "0.1.0"
description = "Always-on assistant: web UI, Redis job queue, pgvector memories, Nango app keys, in front of hermes-agent."
readme = "README.md"
authors = [
    { name = "Matt <3", email = "367789+whatever@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agent-client-protocol[http]>=0.12.1,<0.13",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.40.0",
    "click>=8.5.0",
    "fastapi>=0.141.1",
    "githubkit[auth-app]>=0.16.1",
    "httpx>=0.28.1",
    "pgvector>=0.4.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dash = "dash:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fakeredis>=2.31.0",
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.9",
]
