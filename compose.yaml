# Local stack for dash. Same parts as geometry.dev/apps/dash, with local stand-ins:
#   RDS → postgres (pgvector), hermes-router → hermes-agent → litellm → Bedrock.
#   hermes-agent runs terminal commands over ssh in the sandbox container.
#
#   cp .env.example .env   # optional; see the comments in it
#   docker compose up --build
#
# Then open:
#   http://localhost:8000   dash (served by the API)
#   http://localhost:8080   dash through the nginx webui image
#   http://localhost:3003   Nango dashboard (needs NANGO_ENCRYPTION_KEY in .env)
#   http://localhost:8642   hermes-agent API
#   http://localhost:4000   LiteLLM (needs AWS credentials that can call Bedrock)

name: dashes

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_PROFILE: ${AWS_PROFILE:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_CONFIG_FILE: /aws/config
  AWS_SHARED_CREDENTIALS_FILE: /aws/credentials

x-dash-env: &dash-env
  <<: *aws-env
  DATABASE_URL: postgresql://dash:dash@postgres:5432/dash
  REDIS_URL: redis://redis:6379/0
  HERMES_BASE_URL: ${HERMES_BASE_URL:-http://hermes-agent:8642/v1}
  HERMES_API_KEY: ${HERMES_API_KEY:-sk-local-hermes-dev}
  HERMES_MODEL: ${HERMES_MODEL:-hermes-opus}
  NANGO_URL: http://nango:3003
  NANGO_PUBLIC_URL: http://localhost:3003
  NANGO_CONNECT_URL: http://localhost:3009
  NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-}
  MEMORY_BASE_URL: ${MEMORY_BASE_URL:-}
  MEMORY_API_KEY: ${MEMORY_API_KEY:-}
  EMBED_MODEL: ${EMBED_MODEL:-amazon.titan-embed-text-v2:0}
  EXTRACT_MODEL: ${EXTRACT_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}

x-dash: &dash
  build: .
  image: dash:local
  environment: *dash-env
  volumes:
    - ${HOME}/.aws:/aws:ro
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dash
      POSTGRES_PASSWORD: dash
      POSTGRES_DB: dash
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./dev/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: [CMD, pg_isready, -U, dash, -d, dash]
      interval: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    command: [--appendonly, "yes", --appendfsync, everysec]
    volumes:
      - redis:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30

  # The cluster runs this as the API's init container.
  migrate:
    <<: *dash
    command: [dash, migrate]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *dash
    command: [dash, serve, --host, 0.0.0.0, --port, "8000"]
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *dash
    command: [dash, worker]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    image: dash-webui:local
    environment:
      DASH_API_URL: http://api:8000
    ports:
      - 127.0.0.1:8080:8080
    depends_on: [api]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: [--config, /etc/litellm/config.yaml, --port, "4000"]
    environment:
      <<: *aws-env
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DISABLE_ADMIN_UI: "True"
      NO_DOCS: "True"
    volumes:
      - ${LITELLM_CONFIG:-./dev/litellm.yaml}:/etc/litellm/config.yaml:ro
      - ${HOME}/.aws:/aws:ro
    ports:
      - 127.0.0.1:4000:4000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      start_period: 30s
      retries: 30
    restart: unless-stopped

  hermes-seed:
    image: alpine:3.20
    command: [/seed.sh]
    environment:
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-local}
    volumes:
      - ./dev/hermes-seed.sh:/seed.sh:ro
      - ./dev/hermes-config.yaml:/etc/hermes/config.yaml:ro
      - hermes:/opt/data
      - hermes-ssh:/opt/data/.ssh
    restart: "no"

  sandbox:
    image: lscr.io/linuxserver/openssh-server:10.2_p1-r0-ls226
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      USER_NAME: agent
      SUDO_ACCESS: "true"
      PASSWORD_ACCESS: "false"
      PUBLIC_KEY_FILE: /keys/id_ed25519.pub
    volumes:
      - sandbox:/config
      - hermes-ssh:/keys:ro
      - ./dev/sandbox-init.sh:/custom-cont-init.d/10-tools:ro
    healthcheck:
      test: [CMD, nc, -z, localhost, "2222"]
      interval: 5s
      retries: 30
    depends_on:
      hermes-seed: { condition: service_completed_successfully }
    restart: unless-stopped

  hermes-agent:
    image: nousresearch/hermes-agent:v2026.8.27
    command: [gateway, run, --replace]
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_MODEL_NAME: hermes-opus
      API_SERVER_KEY: ${HERMES_API_KEY:-sk-local-hermes-dev}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-local}
      TMPDIR: /opt/data/cache/vision-tmp
    volumes:
      - hermes:/opt/data
      - hermes-ssh:/opt/data/.ssh
      - hermes-workspace:/config/workspace
    ports:
      - 127.0.0.1:8642:8642
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8642/health')"]
      interval: 5s
      start_period: 20s
      retries: 30
    depends_on:
      hermes-seed: { condition: service_completed_successfully }
      litellm: { condition: service_healthy }
      sandbox: { condition: service_healthy }
    restart: unless-stopped

  nango:
    image: nangohq/nango-server:hosted
    environment:
      SERVER_RUN_MODE: DOCKERIZED
      SERVER_PORT: "3003"
      NANGO_DATABASE_URL: postgresql://dash:dash@postgres:5432/nango
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:-}  # required; see .env.example
      NANGO_REDIS_URL: redis://redis:6379/1
      NANGO_SERVER_URL: http://localhost:3003
      NANGO_PUBLIC_CONNECT_URL: http://localhost:3009
      FLAG_SERVE_CONNECT_UI: "true"
      FLAG_AUTH_ENABLED: "false"
      NANGO_DASHBOARD_USERNAME: admin
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:-change-me}
      TELEMETRY: "false"
    ports:
      - 127.0.0.1:3003:3003
      - 127.0.0.1:3009:3009
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres:
  redis:
  hermes:
  hermes-ssh:
  hermes-workspace:
  sandbox:
